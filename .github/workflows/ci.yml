name: Signal CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Signal.sln

      - name: Build Solution
        run: dotnet build Signal.sln -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test Signal.sln -c Release --no-build --verbosity normal
